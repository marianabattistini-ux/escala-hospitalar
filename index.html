<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Escala Hospitalar</title>
</head>
<body>

  <!-- 1. Painel do chat -->
  <dta-chat label="LYNN"></dta-chat>

  <!-- 2. Botão flutuante -->
  <dta-chat-anchor size="22"></dta-chat-anchor>

  <!-- 3. Configuração -->
  <script>
    window.addEventListener(
      'dta-chat-ready',
      (event) => {
        const dtaChatApi = event.detail;

        dtaChatApi.addHeaders({
          ['x-dta-api-key']: '06a73735-17c1-7969-8000-2698d8dd38b7',
        });
        dtaChatApi.config(getConfig());
      },
      { once: true },
    );

    function getConfig() {
      const baseUrl = 'https://totvs.dta.totvs.ai/api/agents/projects/pep-gestao/agents/06a73735-17c1-7969-8000-2698d8dd38b7/run';

      return {
        apiInit: {
          url: baseUrl,
          sendHeaders: ['06a73735-17c1-7969-8000-2698d8dd38b7'],
        },
        apiMessage: {
          url: baseUrl,
          method: 'POST',
          sendHeaders: ['06a73735-17c1-7969-8000-2698d8dd38b7'],
        },
        header_session_prefix: null,
        header_thread_prefix: null,
        header_session: 'x-dta-session-id',
        header_thread: 'x-dta-trace-id',
      };
    }
  </script>

  <!-- 4. Carrega o widget via CDN -->
  <script defer src="https://assets.dta.totvs.ai/client/stable/dta_chat.js"></script>

</body>
</html>
